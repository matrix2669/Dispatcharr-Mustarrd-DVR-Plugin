name: Validate plugin
on:
  push:
    branches: [dev, 'fix/**', 'feature/**']
    tags: ['v*']
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests and package metadata
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m py_compile mustarrd-dvr-handoff/*.py
          python3 -m json.tool mustarrd-dvr-handoff/plugin.json > /dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          version = Path('VERSION').read_text().strip()
          assert json.loads(Path('mustarrd-dvr-handoff/plugin.json').read_text())['version'] == version
          assert f'_core.Plugin.version = "{version}"' in Path('mustarrd-dvr-handoff/plugin.py').read_text()
          PY
          git diff --check
      - name: Disposable official Dispatcharr installer and loader
        run: |
          curl --fail --location --silent --show-error https://api.github.com/repos/Dispatcharr/Dispatcharr/tarball/bcbb68c4f054ee56383a41604cfcd7302b85da66 -o /tmp/dispatcharr.tar.gz
          mkdir /tmp/dispatcharr-official
          tar -xzf /tmp/dispatcharr.tar.gz -C /tmp/dispatcharr-official --strip-components=1
          git archive --format=zip --prefix=source/ HEAD -o /tmp/plugin.zip
          python3 scripts/validate_dispatcharr.py /tmp/dispatcharr-official /tmp/plugin.zip
